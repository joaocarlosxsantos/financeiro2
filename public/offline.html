<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão — Mutano Contas</title>
  <style>
    :root {
      --bg: #000;
      --text: #f5f5f5;
      --text-muted: #888;
      --acento: #c8ff14;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #F5F3EE; --text: #111; --text-muted: #555; --acento: #4f7a0f; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 1.25rem;
      border-radius: 12px;
      background: var(--acento);
      color: #000;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon" aria-hidden="true">📡</span>
    <h1>Sem conexão com a internet</h1>
    <p>
      Você está offline. Verifique sua conexão e tente novamente.
      Seus dados financeiros estão protegidos e serão carregados quando
      a conexão for restaurada.
    </p>
    <a href="/painel">Tentar novamente</a>
  </div>
</body>
</html>
